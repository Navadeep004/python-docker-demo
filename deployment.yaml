apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-k8s-demo
  namespace: jenkins

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-k8s-demo

  template:
    metadata:
      labels:
        app: flask-k8s-demo

    spec:
      containers:
        - name: flask-k8s-demo
          image: navadeep04/flask-k8s-demo:1

          ports:
            - containerPort: 5000

          imagePullPolicy: Always