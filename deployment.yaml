apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-k8s-demo
  namespace: jenkins

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-k8s-demo

  template:
    metadata:
      labels:
        app: jenkins-k8s-demo

    spec:
      containers:
        - name: jenkins-k8s-demo
          image: navadeep04/jenkins-k8s-demo:1
          imagePullPolicy: Always